# Statischer Webserver für den Screenshot-Editor.
# Datenschutz: kein Access-Log, keine Uploads, nur GET/HEAD.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    access_log    off;
    log_not_found off;

    # Es gibt nichts hochzuladen.
    client_max_body_size 1k;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # connect-src 'none' verhindert, dass die Seite selbst Daten versenden kann.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; font-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
